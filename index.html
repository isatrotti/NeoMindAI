<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeoMind AI — Inteligência Neogrid</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0A1628;
    --navy-mid: #112240;
    --navy-light: #1a3560;
    --red: #E8382D;
    --red-glow: rgba(232,56,45,0.15);
    --white: #FFFFFF;
    --gray: #94A3B8;
    --gray-light: #CBD5E1;
    --surface: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--navy);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  header {
    position: relative;
    z-index: 10;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(10,22,40,0.8);
    backdrop-filter: blur(12px);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background: var(--red);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: -0.5px;
  }

  .logo-text {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.3px;
  }

  .logo-text span {
    color: var(--red);
  }

  .badge {
    font-size: 11px;
    font-weight: 500;
    color: var(--gray);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 100px;
    letter-spacing: 0.5px;
  }

  /* Main layout */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* Welcome state */
  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 20px;
    gap: 32px;
  }

  .welcome-icon {
    width: 72px;
    height: 72px;
    background: var(--red-glow);
    border: 1px solid rgba(232,56,45,0.3);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(232,56,45,0.2); }
    50% { box-shadow: 0 0 0 12px rgba(232,56,45,0); }
  }

  .welcome h1 {
    font-family: 'Syne', sans-serif;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1.2;
  }

  .welcome h1 span { color: var(--red); }

  .welcome p {
    font-size: 15px;
    color: var(--gray);
    line-height: 1.7;
    max-width: 480px;
  }

  .suggestions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
    max-width: 560px;
  }

  .suggestion-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--gray-light);
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
    line-height: 1.4;
  }

  .suggestion-btn:hover {
    background: var(--red-glow);
    border-color: rgba(232,56,45,0.3);
    color: var(--white);
    transform: translateY(-1px);
  }

  /* Chat area */
  #chat-area {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 24px 0;
    gap: 16px;
    flex-direction: column;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  #chat-area.visible {
    display: flex;
  }

  .message {
    display: flex;
    gap: 12px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    flex-direction: row-reverse;
  }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    font-weight: 600;
  }

  .avatar.ai {
    background: var(--red);
    font-family: 'Syne', sans-serif;
    font-size: 11px;
  }

  .avatar.user-av {
    background: var(--navy-light);
    border: 1px solid var(--border);
  }

  .bubble {
    max-width: 75%;
    padding: 14px 18px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.7;
  }

  .message.ai .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  .message.user .bubble {
    background: var(--red);
    border-top-right-radius: 4px;
    color: white;
  }

  .bubble strong { font-weight: 600; }
  .bubble em { color: var(--gray-light); font-style: normal; }

  /* Typing indicator */
  .typing-dots {
    display: flex;
    gap: 4px;
    padding: 6px 0;
    align-items: center;
  }

  .typing-dots span {
    width: 6px;
    height: 6px;
    background: var(--gray);
    border-radius: 50%;
    animation: dot 1.2s ease-in-out infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dot {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Input area */
  .input-area {
    position: relative;
    z-index: 10;
    padding: 16px 0 24px;
    border-top: 1px solid var(--border);
    background: rgba(10,22,40,0.8);
    backdrop-filter: blur(12px);
  }

  .input-wrapper {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 14px;
    transition: border-color 0.2s;
  }

  .input-wrapper:focus-within {
    border-color: rgba(232,56,45,0.4);
  }

  #user-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    resize: none;
    max-height: 120px;
    min-height: 22px;
  }

  #user-input::placeholder { color: var(--gray); }

  #send-btn {
    width: 34px;
    height: 34px;
    background: var(--red);
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  #send-btn:hover { background: #c0392b; transform: scale(1.05); }
  #send-btn:disabled { background: var(--navy-light); cursor: not-allowed; transform: none; }

  .input-hint {
    font-size: 11px;
    color: var(--gray);
    text-align: center;
    margin-top: 10px;
    opacity: 0.6;
  }

  /* Error state */
  .error-bubble {
    background: rgba(232,56,45,0.1);
    border: 1px solid rgba(232,56,45,0.3);
    color: #ff6b6b;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 13px;
  }

  /* Products pill */
  .products-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 16px;
  }

  .product-pill {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 100px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--gray);
  }

  @media (max-width: 600px) {
    header { padding: 16px 20px; }
    .suggestions { grid-template-columns: 1fr; }
    .welcome h1 { font-size: 24px; }
    .bubble { max-width: 88%; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">NM</div>
    <div class="logo-text">Neo<span>Mind</span></div>
  </div>
  <div class="badge">Inteligência Comercial · Neogrid</div>
</header>

<main>
  <!-- Welcome state -->
  <div class="welcome" id="welcome">
    <div class="welcome-icon">⚡</div>
    <div>
      <h1>Seu assistente de<br><span>inteligência de produtos</span></h1>
    </div>
    <p>Pergunte sobre soluções, diferenciais, ICPs, battlecards, cases e comparações entre produtos do portfólio Neogrid.</p>
    
    <div class="suggestions">
      <button class="suggestion-btn" onclick="sendSuggestion(this.textContent)">Quais os diferenciais do VMI frente à concorrência?</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this.textContent)">Qual solução indicar para cliente com problema de ruptura?</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this.textContent)">Compare DRP e S&OP para uma indústria de CPG</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this.textContent)">Quais resultados o VMI já gerou em clientes reais?</button>
    </div>

    <div class="products-row">
      <span class="product-pill">VMI</span>
      <span class="product-pill">DRP</span>
      <span class="product-pill">S&OP</span>
      <span class="product-pill">NeoLog</span>
      <span class="product-pill">EDI</span>
      <span class="product-pill">NeoSmart Order</span>
    </div>
  </div>

  <!-- Chat area -->
  <div id="chat-area"></div>
</main>

<!-- Input -->
<div class="input-area">
  <div style="max-width:820px;margin:0 auto;padding:0 20px;">
    <div class="input-wrapper">
      <textarea 
        id="user-input" 
        placeholder="Pergunte sobre produtos, diferenciais, ICP, battlecards..."
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button id="send-btn" onclick="sendMessage()" title="Enviar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="input-hint">Enter para enviar · Shift+Enter para nova linha</div>
  </div>
</div>

<script>
const chatArea = document.getElementById('chat-area');
const welcome = document.getElementById('welcome');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

let conversationHistory = [];
let isLoading = false;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function sendSuggestion(text) {
  userInput.value = text;
  sendMessage();
}

function showWelcome(show) {
  welcome.style.display = show ? 'flex' : 'none';
  if (show) {
    chatArea.classList.remove('visible');
  } else {
    chatArea.classList.add('visible');
  }
}

function addMessage(role, content) {
  const msg = document.createElement('div');
  msg.className = `message ${role}`;
  
  const avatar = document.createElement('div');
  avatar.className = `avatar ${role === 'ai' ? 'ai' : 'user-av'}`;
  avatar.textContent = role === 'ai' ? 'NM' : '👤';
  
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  
  if (role === 'ai') {
    bubble.innerHTML = formatText(content);
  } else {
    bubble.textContent = content;
  }
  
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatArea.appendChild(msg);
  chatArea.scrollTop = chatArea.scrollHeight;
  
  return msg;
}

function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>')
    .replace(/^/, '<p>')
    .replace(/$/, '</p>');
}

function addTyping() {
  const msg = document.createElement('div');
  msg.className = 'message ai';
  msg.id = 'typing-msg';
  
  const avatar = document.createElement('div');
  avatar.className = 'avatar ai';
  avatar.textContent = 'NM';
  
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatArea.appendChild(msg);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing-msg');
  if (t) t.remove();
}

async function sendMessage() {
  if (isLoading) return;
  
  const text = userInput.value.trim();
  if (!text) return;
  
  // Show chat, hide welcome
  showWelcome(false);
  
  // Add user message
  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });
  
  // Clear input
  userInput.value = '';
  userInput.style.height = 'auto';
  
  // Disable send
  isLoading = true;
  sendBtn.disabled = true;
  
  // Show typing
  addTyping();
  
  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        history: conversationHistory.slice(-10) // last 5 turns
      })
    });
    
    removeTyping();
    
    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error || 'Erro na API');
    }
    
    const data = await response.json();
    const aiText = data.response;
    
    addMessage('ai', aiText);
    conversationHistory.push({ role: 'assistant', content: aiText });
    
  } catch (error) {
    removeTyping();
    
    const errMsg = document.createElement('div');
    errMsg.className = 'message ai';
    errMsg.innerHTML = `
      <div class="avatar ai">NM</div>
      <div class="error-bubble">⚠️ ${error.message || 'Erro de conexão. Tente novamente.'}</div>
    `;
    chatArea.appendChild(errMsg);
    chatArea.scrollTop = chatArea.scrollHeight;
  }
  
  isLoading = false;
  sendBtn.disabled = false;
  userInput.focus();
}
</script>
</body>
</html>
