<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeoMind AI — Inteligência Neogrid</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0A1628;--red:#E8382D;--red-glow:rgba(232,56,45,0.15);--white:#FFFFFF;--gray:#94A3B8;--gray-light:#CBD5E1;--surface:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--navy);color:var(--white);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
  header{position:relative;z-index:10;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(10,22,40,0.8);backdrop-filter:blur(12px)}
  .logo{display:flex;align-items:center;gap:10px}
  .logo-text{font-family:'Syne',sans-serif;font-weight:700;font-size:18px;letter-spacing:-0.3px}
  .logo-text span{color:var(--red)}
  .badge{font-size:11px;font-weight:500;color:var(--gray);background:var(--surface);border:1px solid var(--border);padding:4px 10px;border-radius:100px;letter-spacing:0.5px}
  main{flex:1;display:flex;flex-direction:column;position:relative;z-index:1;max-width:820px;width:100%;margin:0 auto;padding:0 20px}
  .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 20px;gap:28px}
  .welcome-icon{animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{0%,100%{filter:drop-shadow(0 0 0px rgba(232,56,45,0.3))}50%{filter:drop-shadow(0 0 20px rgba(232,56,45,0.5))}}
  .welcome h1{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;letter-spacing:-0.5px;line-height:1.2}
  .welcome h1 span{color:var(--red)}
  .welcome p{font-size:15px;color:var(--gray);line-height:1.7;max-width:480px}
  .suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:560px}
  .suggestion-btn{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;color:var(--gray-light);font-size:13px;font-family:'Inter',sans-serif;text-align:left;cursor:pointer;transition:all 0.2s;line-height:1.4}
  .suggestion-btn:hover{background:var(--red-glow);border-color:rgba(232,56,45,0.3);color:var(--white);transform:translateY(-1px)}
  .products-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .product-pill{font-size:11px;padding:4px 10px;border-radius:100px;background:var(--surface);border:1px solid var(--border);color:var(--gray)}
  #chat-area{display:none;flex:1;overflow-y:auto;padding:24px 0;gap:16px;flex-direction:column;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
  #chat-area.visible{display:flex}
  .message{display:flex;gap:12px;animation:fadeIn 0.3s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .message.user{flex-direction:row-reverse}
  .avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .avatar.ai{background:transparent}
  .avatar.user-av{background:#1a3560;border:1px solid var(--border);font-size:14px}
  .bubble{max-width:75%;padding:14px 18px;border-radius:16px;font-size:14px;line-height:1.7}
  .message.ai .bubble{background:var(--surface);border:1px solid var(--border);border-top-left-radius:4px}
  .message.user .bubble{background:var(--red);border-top-right-radius:4px;color:white}
  .bubble strong{font-weight:600}
  .typing-dots{display:flex;gap:4px;padding:6px 0;align-items:center}
  .typing-dots span{width:6px;height:6px;background:var(--gray);border-radius:50%;animation:dot 1.2s ease-in-out infinite}
  .typing-dots span:nth-child(2){animation-delay:0.2s}
  .typing-dots span:nth-child(3){animation-delay:0.4s}
  @keyframes dot{0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-6px);opacity:1}}
  .input-area{position:relative;z-index:10;padding:16px 0 24px;border-top:1px solid var(--border);background:rgba(10,22,40,0.8);backdrop-filter:blur(12px)}
  .input-wrapper{display:flex;align-items:flex-end;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;transition:border-color 0.2s}
  .input-wrapper:focus-within{border-color:rgba(232,56,45,0.4)}
  #user-input{flex:1;background:none;border:none;outline:none;color:var(--white);font-family:'Inter',sans-serif;font-size:14px;line-height:1.5;resize:none;max-height:120px;min-height:22px}
  #user-input::placeholder{color:var(--gray)}
  #send-btn{width:34px;height:34px;background:var(--red);border:none;border-radius:10px;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0}
  #send-btn:hover{background:#c0392b;transform:scale(1.05)}
  #send-btn:disabled{background:#1a3560;cursor:not-allowed;transform:none}
  .input-hint{font-size:11px;color:var(--gray);text-align:center;margin-top:10px;opacity:0.6}
  .error-bubble{background:rgba(232,56,45,0.1);border:1px solid rgba(232,56,45,0.3);color:#ff6b6b;border-radius:12px;padding:12px 16px;font-size:13px}
  @media(max-width:600px){header{padding:14px 16px}.suggestions{grid-template-columns:1fr}.welcome h1{font-size:26px}.bubble{max-width:88%}}
</style>
</head>

function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
function sendSuggestion(t){userInput.value=t;sendMessage()}

function formatText(t){
  return '<p>'+t
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/\n\n/g,'</p><p>')
    .replace(/\n/g,'<br>')+'</p>';
}

function addMessage(role,content){
  if(role==='user'&&welcome.style.display!=='none'){
    welcome.style.display='none';
    chatArea.classList.add('visible');
  }
  const msg=document.createElement('div');
  msg.className='message '+role;
  const av=document.createElement('div');
  av.className='avatar '+(role==='ai'?'ai':'user-av');
  av.innerHTML=role==='ai'?NEOGRID_LOGO:'👤';
  const bub=document.createElement('div');
  bub.className='bubble';
  bub.innerHTML=role==='ai'?formatText(content):escHtml(content);
  msg.appendChild(av);
  msg.appendChild(bub);
  chatArea.appendChild(msg);
  chatArea.scrollTop=chatArea.scrollHeight;
  return msg;
}

function escHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function addTyping(){
  const msg=document.createElement('div');
  msg.className='message ai';msg.id='typing';
  const av=document.createElement('div');av.className='avatar ai';av.innerHTML=NEOGRID_LOGO;
  const bub=document.createElement('div');bub.className='bubble';
  bub.innerHTML='<div class="typing-dots"><span></span><span></span><span></span></div>';
  msg.appendChild(av);msg.appendChild(bub);
  chatArea.appendChild(msg);chatArea.scrollTop=chatArea.scrollHeight;
}

async function sendMessage(){
  if(loading)return;
  const text=userInput.value.trim();
  if(!text)return;
  addMessage('user',text);
  history.push({role:'user',content:text});
  userInput.value='';userInput.style.height='auto';
  loading=true;sendBtn.disabled=true;
  addTyping();
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:history.slice(-10)})});
    document.getElementById('typing')?.remove();
    if(!r.ok){const e=await r.json();throw new Error(e.details||e.error||'Erro na API')}
    const d=await r.json();
    addMessage('ai',d.response);
    history.push({role:'assistant',content:d.response});
  }catch(e){
    document.getElementById('typing')?.remove();
    const err=document.createElement('div');
    err.className='message ai';
    err.innerHTML=`<div class="avatar ai">${NEOGRID_LOGO}</div><div class="error-bubble">Erro: ${e.message}</div>`;
    chatArea.appendChild(err);
  }
  loading=false;sendBtn.disabled=false;userInput.focus();
}
</script>
